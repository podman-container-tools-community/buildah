# Storage for buildah inside the image, after upstream's quay.io/buildah/stable image:
# native overlay (works rootless on current kernels as long as /var/lib/containers and
# /home/build/.local/share/containers are volumes, not the image's overlay), plus
# upstream's additional image store in /var/lib/shared for a read-only store mounted
# there. fuse-overlayfs is installed for kernels without rootless overlay
# (mount_program = "/usr/bin/fuse-overlayfs").
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/var/lib/shared"]

[storage.options.overlay]
mountopt = "nodev"
