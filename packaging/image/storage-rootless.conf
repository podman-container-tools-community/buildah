# Rootless storage for the build user: as /etc/containers/storage.conf, which a user's
# storage.conf replaces instead of extending, without runroot and graphroot (only root can
# write those; the defaults are under $HOME and /run/user or /tmp).
[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["/var/lib/shared"]

[storage.options.overlay]
mountopt = "nodev"
