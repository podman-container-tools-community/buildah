# buildah inside a container, as in upstream's image: chroot isolation (set by
# BUILDAH_ISOLATION in the image) shares the container's namespaces, and there is no
# systemd or cgroup delegation. buildah reads only the namespace keys and cgroup_manager;
# podman's log and events settings do not apply to it.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"

[engine]
cgroup_manager = "cgroupfs"
