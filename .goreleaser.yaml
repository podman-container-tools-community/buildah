# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Runs in a checkout of upstream buildah at a release tag, with this repository in
# .build/ (see .github/actions/setup).
#
# buildah needs cgo (rootless user namespaces, chroot isolation, seccomp), so both
# architectures are cross-compiled with zig cc and linked statically against musl and
# libseccomp (built by .github/actions/setup):
#   goreleaser release --config .build/.goreleaser.yaml
# goreleaser takes the module, go.sum and tag from the upstream checkout. The binaries
# are still built from the Go module proxy and verified against sum.golang.org
# (gomod.proxy), so neither the checkout nor this repository can alter the source.
#
# SYSROOT holds the C headers and static libraries for both architectures
# (hack/build-sysroot.sh). The image is built separately by hack/build-image.sh.
# GPG_KEY_PATH names the GPG private key that signs the deb and rpm packages; unset
# means unsigned. IS_LATEST=true marks the newest upstream release.
version: 2

project_name: buildah

gomod:
  proxy: true
  env:
    - GOPROXY=https://proxy.golang.org
    - GOSUMDB=sum.golang.org
    - GOFLAGS=-mod=mod

builds:
  - id: buildah
    main: ./cmd/buildah
    binary: buildah
    env:
      - CGO_ENABLED=1
      # Setting CGO_CFLAGS replaces Go's default "-O2 -g"; without -O2 zig compiles in
      # debug mode with the UBSan runtime, whose symbols nothing provides. go-sqlite3 uses
      # the *64 functions such as pread64, which musl 1.2.4 only declares with
      # _LARGEFILE64_SOURCE. Before 1.36, hack/musl-compat.h (in the sysroot) declares
      # basename().
      - CGO_CFLAGS=-O2 -g -D_LARGEFILE64_SOURCE{{ if and (eq .Major 1) (lt .Minor 36) }} -include {{ .Env.SYSROOT }}/musl-compat.h{{ end }}
      # zig cc cross-compiles against musl and the static libseccomp the setup action
      # builds into $SYSROOT/<arch>.
      - >-
        {{- if and (eq .Os "linux") (eq .Arch "amd64") }}CC=zig cc -target x86_64-linux-musl{{- end }}
        {{- if and (eq .Os "linux") (eq .Arch "arm64") }}CC=zig cc -target aarch64-linux-musl{{- end }}
      - >-
        {{- if and (eq .Os "linux") (eq .Arch "amd64") }}PKG_CONFIG_LIBDIR={{ .Env.SYSROOT }}/x86_64/lib/pkgconfig{{- end }}
        {{- if and (eq .Os "linux") (eq .Arch "arm64") }}PKG_CONFIG_LIBDIR={{ .Env.SYSROOT }}/aarch64/lib/pkgconfig{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64: [v1]
    goarm64: [v8.0]
    flags:
      - -trimpath
    # Upstream's Makefile tags, minus the ones for libraries a static binary cannot use:
    # - seccomp: libseccomp, linked statically
    # - apparmor: pure Go, loads profiles with apparmor_parser
    # - systemd: pure Go in buildah (containers/common only checks for /run/systemd/system;
    #   nothing links libsystemd). Without it the default --cgroup-manager is cgroupfs
    #   even on systemd hosts, unlike the distributions' builds.
    # - containers_image_openpgp: pure-Go OpenPGP instead of gpgme
    # - exclude_graphdriver_btrfs: btrfs driver needs libbtrfs headers
    # - exclude_graphdriver_devicemapper: devicemapper needs libdevmapper; upstream
    #   dropped the driver later, the tag is harmless for newer versions
    # Not set: libsubid (loads NSS providers with dlopen), libsqlite3 (go-sqlite3 uses
    # its bundled SQLite instead).
    tags:
      - seccomp
      - apparmor
      - systemd
      - containers_image_openpgp
      - exclude_graphdriver_btrfs
      - exclude_graphdriver_devicemapper
    ldflags:
      - -s -w
      - -linkmode external
      # -s for the external linker too; Go's -s -w do not strip what it adds.
      - -extldflags '-static -s'
      - -X main.GitCommit={{ .FullCommit }}
      - -X main.buildInfo={{ .CommitTimestamp }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: buildah
    ids: [buildah]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: contrib/completions/bash/buildah
        dst: completions/bash/buildah
  - id: binary
    ids: [buildah]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

# Replace the distribution's buildah package. Epoch 3 sorts above every distribution
# version (Fedora uses epoch 2, Debian none), so upgrades do not switch back.
# Configuration in /etc/containers belongs to the distribution's containers-common: it is
# a dependency, not a recommendation, because without its policy.json every pull fails
# (and apt --no-install-recommends or dnf install_weak_deps=False would leave it out).
# Releases since 1.44 refuse to create containers without netavark, even with host
# networking; it is only recommended because Ubuntu 22.04 has no netavark package.
nfpms:
  - id: buildah
    ids: [buildah]
    package_name: buildah
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: podman-container-tools-community
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    maintainer: podman-container-tools-community <https://github.com/{{ .Env.GITHUB_REPOSITORY }}/issues>
    description: |-
      Community-built static buildah (upstream: github.com/podman-container-tools/buildah).
      Build OCI container images, with or without a Containerfile.
    license: Apache-2.0
    bindir: /usr/bin
    epoch: "3"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/buildah/LICENSE
      - src: contrib/completions/bash/buildah
        dst: /usr/share/bash-completion/completions/buildah
    # Signed with the repository's GPG key (packaging/gpg.asc) when GPG_KEY_PATH is set;
    # the passphrase comes from NFPM_PASSPHRASE.
    rpm:
      group: Applications/System
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'
    deb:
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'
    # Debian and Ubuntu ship /etc/containers in golang-github-containers-common.
    overrides:
      deb:
        dependencies:
          - golang-github-containers-common | containers-common
        recommends:
          - netavark
          - crun | runc
          - uidmap
          - fuse-overlayfs
      rpm:
        dependencies:
          - containers-common
        recommends:
          - netavark
          - (crun or runc)
          - shadow-utils
          - fuse-overlayfs
    mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

release:
  # Published by release.yaml once the apt repository files are uploaded.
  draft: true
  replace_existing_draft: true
  # The checkout's origin is upstream; releases go to this repository instead.
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: '{{ envOrDefault "GITHUB_REPOSITORY_NAME" .ProjectName }}'
  make_latest: '{{ eq (envOrDefault "IS_LATEST" "false") "true" }}'
  prerelease: auto
  header: |
    Community-maintained static build of [buildah {{ .Tag }}](https://github.com/podman-container-tools/buildah/releases/tag/{{ .Tag }}).
    Not an official release of the buildah project.

    Linked statically against musl (Alpine) with tags `seccomp apparmor systemd containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper`.
    Known limitations: no GPG signing (`--sign-by`), no libsubid (NSS subordinate IDs), no btrfs driver; netavark has to be installed.
    Sources were fetched from proxy.golang.org and verified against sum.golang.org;
    check with `go version -m buildah-linux-amd64`.

changelog:
  disable: true
