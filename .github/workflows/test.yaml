name: test

# Builds one upstream release without publishing anything and runs functional tests
# (hack/functional-test.sh) on amd64 and arm64, as root and rootless.
#
# Upstream's integration tests are not run: they need upstream's CI VMs (bats, a fixed
# set of tools and registries) and for older releases depend on registry content that
# has changed since, so they fail for reasons unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v1.46.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/buildah
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      # dockers_v2 builds and pushes in one step, so a dry run cannot build images.
      - name: Build
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean --skip=publish,sign,docker
        env:
          IS_LATEST: "false"
          IS_LATEST_MINOR: "false"
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Smoke test
        run: |
          go version -m dist/buildah_linux_amd64_v1/buildah
          dist/buildah_linux_amd64_v1/buildah --version
          file dist/buildah_linux_amd64_v1/buildah dist/buildah_linux_arm64_v8.0/buildah | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2

      - name: Collect binaries
        run: |
          mkdir binaries
          cp dist/buildah_linux_amd64_v1/buildah binaries/buildah-amd64
          cp dist/buildah_linux_arm64_v8.0/buildah binaries/buildah-arm64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ inputs.version }}
          path: binaries/
          retention-days: 1

  functional:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: functional (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ inputs.version }}
          path: binaries/

      # netavark (buildah refuses to create containers without it in recent releases),
      # newuidmap/newgidmap and a subordinate ID range for rootless. Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor. oci isolation uses the runc from
      # Docker's containerd.io: Ubuntu's runc package replaces it and stops Docker (and the
      # registry service), and the runner's crun 1.14 rejects runtime spec 1.3.0 from
      # buildah 1.45+.
      - name: Prepare host
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends netavark uidmap jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          grep -q "^$(id -un):" /etc/subuid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/runtime.conf
          [[ -e /etc/containers/policy.json ]] ||
            echo '{"default":[{"type":"insecureAcceptAnything"}]}' | sudo tee /etc/containers/policy.json
          chmod +x binaries/*

      - name: Functional tests
        run: hack/functional-test.sh binaries/buildah-${{ matrix.arch }} localhost:5000

      - name: Image tests
        run: hack/image-test.sh binaries/buildah-${{ matrix.arch }}
