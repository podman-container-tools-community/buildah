name: test

# Builds one upstream release without publishing anything, runs the functional tests
# (hack/functional-test.sh) against the amd64 binary, as root and rootless, and builds
# and tests the image (hack/image-test.sh). Both run bats-core; each test case shows up
# in the log.
#
# Upstream's integration tests are not run: they need upstream's CI VMs (bats, a fixed
# set of tools and registries) and for older releases depend on registry content that
# has changed since, so they fail for reasons unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v1.46.0
        type: string
        required: true
      cache:
        description: Restore and save the C sysroot in the Actions cache (pull request CI only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/buildah
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}
          cache: ${{ inputs.cache }}

      - name: Build
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean --skip=publish,sign

      - name: Smoke test
        run: |
          go version -m dist/buildah_linux_amd64_v1/buildah
          dist/buildah_linux_amd64_v1/buildah --version
          file dist/buildah_linux_amd64_v1/buildah dist/buildah_linux_arm64_v8.0/buildah | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2

      # bats from .build/mise.toml, checked against .build/mise.lock. Its bin directory,
      # not the shims, goes on PATH, so bats also runs outside .build/.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: .build
          add_shims_to_path: false
          cache: false

      # Ubuntu 26.04, like 24.04, denies unprivileged user namespaces to unconfined
      # processes, which the rootless tests need.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # netavark (buildah refuses to create containers without it in recent releases),
      # newuidmap/newgidmap and a subordinate ID range for rootless. oci isolation uses the
      # runc from Docker's containerd.io: Ubuntu's runc package replaces it and stops Docker
      # (and the registry service), and the runner's crun 1.14 rejects runtime spec 1.3.0
      # from buildah 1.45+.
      - name: Prepare host
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends netavark uidmap jq
          grep -q "^$(id -un):" /etc/subuid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid || echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/runtime.conf
          [[ -e /etc/containers/policy.json ]] ||
            echo '{"default":[{"type":"insecureAcceptAnything"}]}' | sudo tee /etc/containers/policy.json

      - name: Functional tests
        run: .build/hack/functional-test.sh dist/buildah_linux_amd64_v1/buildah localhost:5000

      - name: Image tests
        run: .build/hack/image-test.sh dist
